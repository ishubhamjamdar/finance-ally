# The end-to-end suite of PLAN.md §12, and the infrastructure §12 asks for:
# the app container plus a Playwright container, so browser dependencies stay
# out of the production image.
#
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit
#
# The exit code is the runner's. `--abort-on-container-exit` stops the app
# services as soon as the suite finishes; without it they would keep running
# and the command would never return.
#
# Nothing here needs a key. `LLM_MOCK=true` is PLAN.md §9's stated purpose for
# the flag, and an empty MASSIVE_API_KEY selects the simulator — so this suite
# runs on a fork, in CI, and on a laptop with no .env at all.

name: finally-e2e

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: finally:test
  environment:
    LLM_MOCK: "true"
    MASSIVE_API_KEY: ""
    # Present and empty: `complete()` must reach the mock before it looks for a
    # key, and an inherited one from the host would make a "no network" suite
    # quietly capable of calling OpenRouter.
    OPENROUTER_API_KEY: ""
    LOG_LEVEL: "WARNING"
  # No volume, deliberately. Each `up` gets an empty database that the backend
  # creates and seeds on first request, which is what makes the fresh-start
  # assertions mean anything — and what stops one run's trades from being the
  # next run's starting position.
  stop_grace_period: 15s

services:
  # Shared, and mutated by the specs that trade.
  #
  # **Not `app`.** `.app` is an HSTS-preloaded gTLD, and Chromium matches the
  # single-label hostname `app` against that entry: every navigation to
  # `http://app:8000` was force-upgraded to https and failed with
  # `net::ERR_SSL_PROTOCOL_ERROR` before a single assertion ran. The preload
  # list is compiled into the browser, so no launch flag turns it off — the
  # name is the fix. `app-pristine` was never affected, which is what made it
  # look like an application fault rather than a browser policy.
  app-shared:
    <<: *app

  # Touched by nothing. `fresh-start.spec.ts` asserts the seeded $10,000 and
  # the ten default tickers against this one, so that assertion does not
  # silently become "this file ran before the ones that trade" — the order
  # dependence that is this checkpoint's stated review focus.
  app-pristine:
    <<: *app

  playwright:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    image: finally-e2e:test
    depends_on:
      # The image's own HEALTHCHECK, which Checkpoint 8 added: this waits for
      # /api/health to answer rather than sleeping and hoping.
      app-shared:
        condition: service_healthy
      app-pristine:
        condition: service_healthy
    environment:
      BASE_URL: "http://app-shared:8000"
      PRISTINE_URL: "http://app-pristine:8000"
      CI: "true"
    volumes:
      # The specs are mounted so a failing assertion can be edited and re-run
      # without rebuilding. node_modules stays the image's — an anonymous
      # volume keeps the mount from hiding it.
      - ./e2e/specs:/e2e/specs
      - ./e2e/playwright.config.ts:/e2e/playwright.config.ts
      - ./e2e/report:/e2e/playwright-report
      - /e2e/node_modules
    # 1 GB of /dev/shm. Chromium's default 64 MB in a container is the classic
    # source of "Target closed" crashes that read as flaky tests.
    shm_size: "1gb"
